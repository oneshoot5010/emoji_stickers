name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create . --platforms=android --project-name=emoji_stickers

      - name: Allow internet (needed for Google Fonts in release)
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: App name
        run: |
          sed -i 's#android:label="emoji_stickers"#android:label="ستيكرات إيموجي"#' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons

      - run: flutter build apk --release

      - name: Sign APK with the permanent key (if secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk emoji-stickers.apk
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
            "$ANDROID_HOME/build-tools/$BT/apksigner" sign \
              --ks release.jks \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --key-pass env:KEYSTORE_PASSWORD \
              emoji-stickers.apk
            "$ANDROID_HOME/build-tools/$BT/apksigner" verify emoji-stickers.apk
            rm -f release.jks
          else
            echo "No keystore secrets found: APK is debug-signed"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: emoji-stickers-apk
          path: emoji-stickers.apk

      - name: Publish public download link (GitHub Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create latest emoji-stickers.apk \
            -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "أحدث نسخة" \
            --notes "حمّل الملف emoji-stickers.apk وسطّبه على موبايلك."
